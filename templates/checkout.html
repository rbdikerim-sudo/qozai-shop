<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оформление заказа — Qozai Shop</title>
    <style>
        body { font-family: sans-serif; background: #f9f9f9; padding: 40px; }
        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); text-align: center; }
        .btn-kaspi { display: inline-block; background: #f14635; color: white; padding: 16px 32px; border-radius: 8px; font-weight: bold; text-decoration: none; font-size: 18px; margin: 20px 0; }
        .btn-kaspi:hover { background: #d93829; }
    </style>
</head>
<body>
    <div class="container">
        {% if success %}
            <h1>Спасибо за заказ!</h1>
            <p>Мы скоро свяжемся с вами для подтверждения доставки.</p>
            <a href="/" style="display: inline-block; margin-top: 20px; color: #000; font-weight: bold;">Вернуться в магазин</a>
        {% else %}
            <h1>Оплата заказа</h1>
            <p style="color: #666;">Нажмите на кнопку ниже, чтобы перейти к оплате через Kaspi:</p>
            
            <a href="{{ config.payment_link }}" target="_blank" class="btn-kaspi">
                Оплатить через Kaspi ₸
            </a>

            <form action="/checkout" method="POST" enctype="multipart/form-data" style="margin-top: 30px;">
                <button type="submit" style="background: #000; color: #fff; border: none; padding: 12px 25px; border-radius: 6px; font-weight: bold; cursor: pointer;">Заказ оплачен, завершить</button>
            </form>
            <div style="margin-top: 20px;">
                <a href="/cart" style="color: #666; text-decoration: none;">← Вернуться в корзину</a>
            </div>
        {% endif %}
    </div>
</body>
</html>
