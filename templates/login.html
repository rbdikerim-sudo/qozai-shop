<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход в админ-панель — Qozai Shop</title>
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        body { background: #f4f5f7; display: flex; justify-content: center; align-items: center; height: 100vh; color: #111; }
        .login-card {
            background: #fff; padding: 40px; border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.06); width: 100%; max-width: 400px;
        }
        h2 { margin-bottom: 20px; font-size: 22px; text-align: center; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 13px; }
        input[type="password"] {
            width: 100%; padding: 12px; border: 1px solid #ddd;
            border-radius: 6px; font-size: 14px; box-sizing: border-box;
        }
        .error { color: #d9534f; font-size: 13px; margin-bottom: 15px; text-align: center; }
        button {
            background: #111; color: #fff; border: none; padding: 12px;
            width: 100%; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 15px;
        }
        button:hover { background: #333; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; font-size: 13px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Админ-панель Qozai</h2>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>Пароль администратора:</label>
                <input type="password" name="password" required placeholder="Введите пароль">
            </div>
            <button type="submit">Войти</button>
        </form>
        <a href="/" class="back-link">← На главную сайта</a>
    </div>
</body>
</html>
